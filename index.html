<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velvet Brew — Where Every Sip Tells a Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF7F2;
    --cream-dark: #F0EAE0;
    --espresso: #3B2F2F;
    --espresso-light: #5A4848;
    --gold: #C8A97E;
    --gold-dark: #A88A5C;
    --green: #6B7F5A;
    --white: #ffffff;
    --shadow: 0 10px 30px rgba(59, 47, 47, 0.08);
    --shadow-lg: 0 20px 60px rgba(59, 47, 47, 0.15);
    --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--espresso);
    line-height: 1.6;
    overflow-x: hidden;
  }
  h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 600; line-height: 1.2; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  img { max-width: 100%; display: block; }

  .container { max-width: 1280px; margin: 0 auto; padding: 0 2rem; }

  /* ===== NAVBAR ===== */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 1.2rem 2rem;
    z-index: 100;
    transition: var(--transition);
    background: transparent;
  }
  nav.scrolled {
    background: rgba(250, 247, 242, 0.95);
    backdrop-filter: blur(12px);
    box-shadow: 0 2px 20px rgba(0,0,0,0.05);
    padding: 0.8rem 2rem;
  }
  .nav-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--espresso);
    letter-spacing: 1px;
  }
  .logo span { color: var(--gold); font-style: italic; font-weight: 400; }
  .nav-links {
    display: flex; gap: 2.5rem; align-items: center;
    list-style: none;
  }
  .nav-links a {
    color: var(--espresso);
    font-weight: 500;
    font-size: 0.95rem;
    position: relative;
    transition: var(--transition);
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -4px; left: 0;
    width: 0; height: 1.5px; background: var(--gold);
    transition: var(--transition);
  }
  .nav-links a:hover::after { width: 100%; }
  .cart-icon {
    position: relative;
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--espresso);
    color: var(--cream);
    transition: var(--transition);
  }
  .cart-icon:hover { background: var(--gold); transform: scale(1.05); }
  .cart-badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--gold);
    color: var(--espresso);
    font-size: 0.7rem; font-weight: 700;
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .hamburger {
    display: none;
    flex-direction: column; gap: 5px;
    cursor: pointer;
  }
  .hamburger span {
    width: 26px; height: 2px;
    background: var(--espresso);
    transition: var(--transition);
  }
  .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
  .hamburger.active span:nth-child(2) { opacity: 0; }
  .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }

  /* ===== HERO ===== */
  .hero {
    height: 100vh;
    min-height: 700px;
    background: linear-gradient(rgba(59,47,47,0.4), rgba(59,47,47,0.5)),
      url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=1920&q=80') center/cover;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    color: var(--cream);
    position: relative;
  }
  .hero-content { max-width: 800px; padding: 0 2rem; }
  .hero-eyebrow {
    letter-spacing: 4px;
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
    color: var(--gold);
    font-weight: 500;
  }
  .hero h1 {
    font-size: clamp(2.5rem, 7vw, 5.5rem);
    margin-bottom: 1.5rem;
    font-style: italic;
    font-weight: 400;
  }
  .hero p {
    font-size: 1.1rem;
    margin-bottom: 2.5rem;
    opacity: 0.9;
    max-width: 600px;
    margin-left: auto; margin-right: auto;
  }
  .hero-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 0.95rem 2.2rem;
    border-radius: 50px;
    font-weight: 500;
    font-size: 0.95rem;
    letter-spacing: 1px;
    transition: var(--transition);
    display: inline-block;
  }
  .btn-primary { background: var(--gold); color: var(--espresso); }
  .btn-primary:hover { background: var(--gold-dark); transform: translateY(-2px); }
  .btn-outline {
    border: 1.5px solid var(--cream);
    color: var(--cream);
  }
  .btn-outline:hover { background: var(--cream); color: var(--espresso); }
  .btn-dark { background: var(--espresso); color: var(--cream); }
  .btn-dark:hover { background: var(--gold); }

  /* ===== SECTIONS ===== */
  section { padding: 6rem 0; }
  .section-header { text-align: center; margin-bottom: 4rem; }
  .section-eyebrow {
    color: var(--gold);
    letter-spacing: 3px;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
  .section-title {
    font-size: clamp(2rem, 4vw, 3rem);
    margin-bottom: 1rem;
    font-style: italic;
  }
  .section-desc {
    color: var(--espresso-light);
    max-width: 600px;
    margin: 0 auto;
  }

  /* ===== MENU ===== */
  .menu { background: var(--cream); }
  .filter-tabs {
    display: flex; justify-content: center; gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 3rem;
  }
  .filter-tab {
    padding: 0.6rem 1.4rem;
    border-radius: 50px;
    background: transparent;
    color: var(--espresso);
    border: 1.5px solid var(--cream-dark);
    font-weight: 500;
    font-size: 0.9rem;
    transition: var(--transition);
  }
  .filter-tab.active, .filter-tab:hover {
    background: var(--espresso);
    color: var(--cream);
    border-color: var(--espresso);
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 2rem;
  }
  .menu-card {
    background: var(--white);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: var(--transition);
    animation: fadeInUp 0.6s ease-out;
  }
  .menu-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
  .menu-img {
    height: 220px;
    background-size: cover;
    background-position: center;
    position: relative;
  }
  .menu-tag {
    position: absolute; top: 1rem; left: 1rem;
    padding: 0.3rem 0.8rem;
    background: var(--gold);
    color: var(--espresso);
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: 50px;
    letter-spacing: 0.5px;
  }
  .menu-tag.vegan { background: var(--green); color: var(--cream); }
  .menu-tag.gluten { background: #D4A574; color: var(--cream); }
  .menu-body { padding: 1.5rem; }
  .menu-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
  }
  .menu-desc {
    color: var(--espresso-light);
    font-size: 0.9rem;
    margin-bottom: 1.2rem;
    min-height: 45px;
  }
  .menu-footer { display: flex; justify-content: space-between; align-items: center; }
  .menu-price {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--espresso);
  }
  .add-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--espresso);
    color: var(--cream);
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
    font-size: 1.2rem;
  }
  .add-btn:hover { background: var(--gold); transform: rotate(90deg); }

  /* ===== SPECIALS ===== */
  .specials {
    background: var(--espresso);
    color: var(--cream);
  }
  .specials .section-eyebrow { color: var(--gold); }
  .specials .section-desc { color: rgba(250, 247, 242, 0.7); }
  .specials-scroll {
    display: flex; gap: 1.5rem;
    overflow-x: auto;
    padding: 1rem 0;
    scrollbar-width: thin;
    scrollbar-color: var(--gold) transparent;
  }
  .specials-scroll::-webkit-scrollbar { height: 8px; }
  .specials-scroll::-webkit-scrollbar-track { background: rgba(200,169,126,0.1); }
  .specials-scroll::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
  .special-card {
    min-width: 320px;
    background: rgba(250, 247, 242, 0.05);
    border: 1px solid rgba(200, 169, 126, 0.2);
    border-radius: 20px;
    overflow: hidden;
    transition: var(--transition);
  }
  .special-card:hover { border-color: var(--gold); transform: translateY(-4px); }
  .special-img { height: 200px; background-size: cover; background-position: center; }
  .special-body { padding: 1.5rem; }
  .special-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 0.5rem; }
  .special-price { color: var(--gold); font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-top: 0.8rem; }

  /* ===== TESTIMONIALS ===== */
  .testimonials { background: var(--cream-dark); }
  .test-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
  }
  .test-card {
    background: var(--white);
    padding: 2.5rem 2rem;
    border-radius: 20px;
    box-shadow: var(--shadow);
    position: relative;
    transition: var(--transition);
  }
  .test-card:hover { transform: translateY(-4px); }
  .test-stars { color: var(--gold); margin-bottom: 1rem; font-size: 1.1rem; }
  .test-text {
    font-style: italic;
    color: var(--espresso-light);
    margin-bottom: 1.5rem;
    font-size: 1rem;
  }
  .test-author { font-weight: 600; }
  .test-role { font-size: 0.85rem; color: var(--gold-dark); }
  .quote-mark {
    position: absolute; top: 1rem; right: 1.5rem;
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    color: var(--gold);
    opacity: 0.3;
    line-height: 1;
  }

  /* ===== RESERVATION ===== */
  .reservation { background: var(--cream); }
  .res-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
  }
  .res-info h3 { font-size: 2rem; margin-bottom: 1rem; font-style: italic; }
  .res-info p { color: var(--espresso-light); margin-bottom: 1.5rem; }
  .res-form {
    background: var(--white);
    padding: 2.5rem;
    border-radius: 20px;
    box-shadow: var(--shadow);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 0.4rem;
    color: var(--espresso-light);
    letter-spacing: 0.5px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 1.5px solid var(--cream-dark);
    border-radius: 10px;
    font-family: inherit;
    background: var(--cream);
    transition: var(--transition);
    color: var(--espresso);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--gold);
    background: var(--white);
  }

  /* ===== LOYALTY ===== */
  .loyalty {
    background: linear-gradient(135deg, var(--espresso), #2a2020);
    color: var(--cream);
    text-align: center;
  }
  .loyalty h2 { font-style: italic; margin-bottom: 1rem; }
  .loyalty > .container > p { color: rgba(250,247,242,0.7); max-width: 600px; margin: 0 auto 3rem; }
  .loyalty-steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 2rem;
    max-width: 900px;
    margin: 0 auto;
  }
  .loyalty-step {
    padding: 2rem 1rem;
  }
  .loyalty-num {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    color: var(--gold);
    font-style: italic;
    margin-bottom: 0.5rem;
  }
  .loyalty-step h4 { margin-bottom: 0.5rem; }
  .loyalty-step p { color: rgba(250,247,242,0.7); font-size: 0.9rem; }

  /* ===== NEWSLETTER ===== */
  .newsletter { background: var(--cream-dark); text-align: center; }
  .newsletter-form {
    max-width: 500px;
    margin: 2rem auto 0;
    display: flex;
    gap: 0.5rem;
  }
  .newsletter-form input {
    flex: 1;
    padding: 0.95rem 1.5rem;
    border: 1.5px solid transparent;
    border-radius: 50px;
    background: var(--white);
    font-family: inherit;
    transition: var(--transition);
  }
